<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mitya.dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; }
    h1 span { color: #888; }
    nav { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    a {
      display: block;
      padding: 1rem 2rem;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      text-decoration: none;
      font-size: 1.1rem;
      transition: border-color 0.15s, background 0.15s;
    }
    a:hover { border-color: #666; background: #1a1a1a; }
    a .label { font-size: 0.75rem; color: #666; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <h1>mitya<span>.dev</span></h1>
  <nav>
    <a href="https://profile.mitya.dev">
      Portfolio
      <div class="label">profile.mitya.dev</div>
    </a>
    <a href="https://mashov.mitya.dev">
      Mashov
      <div class="label">mashov.mitya.dev</div>
    </a>
  </nav>
</body>
</html>
